const MAGICLINK_REQUEST_WINDOW_MS = 60 * 60 * 1000;
const MAGICLINK_MAX_PER_WINDOW = 5;
const MAGICLINK_COOLDOWN_MS = 60 * 1000;

function getSupabaseAuthStorageKeys() {
    const prefix = `sb-${SUPABASE_PROJECT_REF}-auth-token`;
    const matched = [];
    [localStorage, sessionStorage].forEach((store) => {
        for (let i = 0; i < store.length; i += 1) {
            const key = store.key(i);
            if (key && key.indexOf(prefix) === 0) matched.push([store, key]);
        }
    });
    return matched;
}

function hasSupabaseAuthCache() {
    return getSupabaseAuthStorageKeys().length > 0;
}

function clearSupabaseAuthCache() {
    getSupabaseAuthStorageKeys().forEach(([store, key]) => store.removeItem(key));
}

function readMagicLinkState() {
    try {
        const raw = localStorage.getItem(MAGICLINK_RATE_KEY);
        if (!raw) return { attempts: [], cooldown_until: 0 };
        const parsed = JSON.parse(raw);
        const attempts = Array.isArray(parsed?.attempts) ? parsed.attempts : [];
        const cooldownUntil = Number(parsed?.cooldown_until || 0);
        return { attempts, cooldown_until: Number.isFinite(cooldownUntil) ? cooldownUntil : 0 };
    } catch (_) {
        return { attempts: [], cooldown_until: 0 };
    }
}

function writeMagicLinkState(state) {
    localStorage.setItem(MAGICLINK_RATE_KEY, JSON.stringify(state || { attempts: [], cooldown_until: 0 }));
}

function trimMagicLinkAttempts(attempts) {
    const now = Date.now();
    return (Array.isArray(attempts) ? attempts : []).filter((at) => {
        const ts = Number(at?.ts || 0);
        return Number.isFinite(ts) && now - ts <= MAGICLINK_REQUEST_WINDOW_MS;
    });
}

function updateLoginGuardHint(text) {
    const hintEl = document.getElementById('loginGuardMsg');
    if (!hintEl) return;
    if (!text) {
        hintEl.textContent = '';
        hintEl.style.display = 'none';
        return;
    }
    hintEl.textContent = text;
    hintEl.style.display = 'block';
}

function applyMagicLinkCooldown() {
    const btn = document.getElementById('btnSend');
    if (!btn) return;
    if (magicLinkCooldownTimer) {
        clearInterval(magicLinkCooldownTimer);
        magicLinkCooldownTimer = null;
    }

    const tick = () => {
        const state = readMagicLinkState();
        const remainMs = Math.max(0, Number(state.cooldown_until || 0) - Date.now());
        if (remainMs <= 0) {
            btn.disabled = false;
            btn.innerText = '📧 로그인 링크 받기';
            updateLoginGuardHint('');
            return false;
        }
        const sec = Math.ceil(remainMs / 1000);
        btn.disabled = true;
        btn.innerText = `재전송 대기 ${sec}s`;
        updateLoginGuardHint(`보안을 위해 요청 간 최소 60초 간격을 적용합니다.\n${sec}초 후 다시 시도해주세요.`);
        return true;
    };

    if (!tick()) return;
    magicLinkCooldownTimer = setInterval(() => {
        if (!tick()) {
            clearInterval(magicLinkCooldownTimer);
            magicLinkCooldownTimer = null;
        }
    }, 500);
}

function evaluateMagicLinkGuard(email) {
    const trap = String(document.getElementById('emailTrap')?.value || '').trim();
    if (trap) return { ok: false, reason: 'BOT_BLOCKED', message: '요청이 차단되었습니다. 잠시 후 다시 시도해주세요.' };
    if (Date.now() - loginFormOpenedAt < MAGICLINK_MIN_PAGE_AGE_MS) {
        return { ok: false, reason: 'TOO_FAST', message: '잠시만 기다린 뒤 다시 시도해주세요.' };
    }

    const state = readMagicLinkState();
    const cooldownUntil = Number(state.cooldown_until || 0);
    if (cooldownUntil > Date.now()) {
        const sec = Math.ceil((cooldownUntil - Date.now()) / 1000);
        return { ok: false, reason: 'COOLDOWN', message: `재전송은 ${sec}초 후 가능합니다.` };
    }

    const attempts = trimMagicLinkAttempts(state.attempts);
    if (attempts.length >= MAGICLINK_MAX_PER_WINDOW) {
        return { ok: false, reason: 'WINDOW_LIMIT', message: '요청이 너무 많습니다. 1시간 후 다시 시도해주세요.' };
    }

    const normalized = String(email || '').trim().toLowerCase();
    if (!normalized || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalized)) {
        return { ok: false, reason: 'INVALID_EMAIL', message: '올바른 이메일을 입력해주세요.' };
    }

    return { ok: true, state, attempts, normalized_email: normalized };
}

function recordMagicLinkAttempt(email, success) {
    const state = readMagicLinkState();
    const attempts = trimMagicLinkAttempts(state.attempts);
    attempts.push({ ts: Date.now(), email: String(email || '').toLowerCase(), ok: !!success });
    state.attempts = attempts;
    state.cooldown_until = Date.now() + MAGICLINK_COOLDOWN_MS;
    writeMagicLinkState(state);
    applyMagicLinkCooldown();
}

async function signOutSilently(client = _supabase) {
    suppressSessionExpiredHandling = true;
    try {
        if (client && client.auth) await client.auth.signOut();
    } catch (e) {
        console.error('Silent sign-out failed:', e);
    } finally {
        setTimeout(() => { suppressSessionExpiredHandling = false; }, 500);
    }
}

function showSessionExpiredNoticeOnce() {
    if (sessionStorage.getItem(ERP_SESSION_EXPIRED_NOTICE_KEY) === '1') return;
    sessionStorage.setItem(ERP_SESSION_EXPIRED_NOTICE_KEY, '1');
    showAlert("로그인 세션이 만료되었습니다.\n다시 로그인해 주세요.");
}

async function recoverFromExpiredSession() {
    clearSupabaseAuthCache();
    await signOutSilently(_supabase);
    localStorage.removeItem('erp_user');
    localStorage.removeItem('erp_permissions');
    showScreen('loginForm');
    showSessionExpiredNoticeOnce();
}

window.onload = async function() {
    loginFormOpenedAt = Date.now();
    const hadAuthCache = hasSupabaseAuthCache();
    const { data, error } = await _supabase.auth.getUser();

    if (error && hadAuthCache) {
        await recoverFromExpiredSession();
        return;
    }

    if (data?.user) {
        sessionStorage.removeItem(ERP_SESSION_EXPIRED_NOTICE_KEY);
        await loadUserInfo(data.user);
    } else {
        showScreen('loginForm');
        applyMagicLinkCooldown();
    }

    _supabase.auth.onAuthStateChange(async (event, session) => {
        if (session) {
            sessionStorage.removeItem(ERP_SESSION_EXPIRED_NOTICE_KEY);
            return;
        }

        const shouldRecover =
            !suppressSessionExpiredHandling &&
            (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') &&
            hasSupabaseAuthCache();
        if (shouldRecover) await recoverFromExpiredSession();
    });
};

async function loadUserInfo(user) {
    const email = user?.email || user?.user_metadata?.email || user?.user_metadata?.account_email;
    if (!email) {
        showAlert("이메일 정보가 없습니다.\n카카오 로그인 시 이메일 제공에 동의해주세요.");
        await signOutSilently(_supabase); 
        showScreen('loginForm'); 
        return;
    }
    const { data, error } = await _supabase
        .from('ref_employees')
        .select('*')
        .eq('email', email)
        .single();

    // [복구 완료] 국장님이 요청하신 모달/로그 처리 로직 그대로 복구
    if (error || !data) {
        console.error("접근 권한 없음: 직원 명부에 없는 계정입니다.");
        
        // [규칙 준수] alert 대신 모달 사용
        // (프로젝트에 사용 중인 모달 함수명을 사용하세요. 예: showModal, openAlertModal 등)
        showAlert("접근 권한 없음\n귀하는 직원으로 등록되지 않았습니다. 로그아웃 합니다.");

        await signOutSilently(_supabase); 
        showScreen('loginForm'); 
        return;
    }

    myInfo = data;
    localStorage.setItem('erp_user', JSON.stringify(data));
    permissionSet = await loadPermissions(data);
    localStorage.setItem('erp_permissions', JSON.stringify(Array.from(permissionSet)));

    const elName = document.getElementById('userName');
    const elTeam = document.getElementById('userTeam');
    const elRank = document.getElementById('userRank');

    if (elName) elName.innerText = (data.emp_name || "직원") + " 님";
    if (elTeam) elTeam.innerText = data.department || "-";
    if (elRank) elRank.innerText = data.position || "";

    applyMenuPermissions(data);

    document.getElementById('patchNoteArea')?.classList.remove('hidden');
    await loadNotifications(false);
    showScreen('menuArea');
}

async function loadPermissions(user) {
    const result = new Set();
    if (!user) return result;
    const roleKey = user.role || '';
    const posKey = user.position || '';
    if (!roleKey && !posKey) return result;

    const roleKeys = [roleKey, posKey].filter(Boolean);
    if (roleKey === 'admin_all') roleKeys.push('admin');
    if (roleKey === 'admin') roleKeys.push('admin_all');

    const { data } = await _supabase
        .from('erp_role_permissions')
        .select('permission_key')
        .in('scope', ['role', 'position'])
        .in('role_key', roleKeys)
        .eq('is_enabled', true);

    if (Array.isArray(data)) {
        data.forEach(row => {
            if (row.permission_key) result.add(row.permission_key);
        });
    }
    return result;
}

function hasPermission(key) {
    if (!permissionSet || permissionSet.size === 0) return null; // fallback to legacy rules
    return permissionSet.has(key);
}

function applyMenuPermissions(user) {
    const isAdmin = (user.role === 'admin' || user.role === 'admin_all' || user.position === '국장');
    const isManager = user.role === 'manager' || user.position === '이사';

    const canApproval = hasPermission('approval.view');
    const canMypage = hasPermission('mypage.view');
    const canAccounting = hasPermission('accounting.view');
    const canAdmin = hasPermission('hr.admin');
    const canMemberAdmin = hasPermission('member.admin');
    const canAudit = hasPermission('audit.view');
    const canPerm = hasPermission('permission.manage');

    if (canApproval !== null && !canApproval) document.getElementById('btnApproval')?.classList.add('hidden');
    if (canMypage !== null && !canMypage) document.getElementById('btnMypage')?.classList.add('hidden');

    if (canAccounting === null) {
        if (isAdmin || isManager) document.getElementById('btnAccounting')?.classList.remove('hidden');
    } else if (canAccounting) {
        document.getElementById('btnAccounting')?.classList.remove('hidden');
    }

    if (canAdmin === null) {
        if (isAdmin) document.getElementById('btnAdmin')?.classList.remove('hidden');
    } else if (canAdmin) {
        document.getElementById('btnAdmin')?.classList.remove('hidden');
    }

    if (canMemberAdmin === null) {
        if (isAdmin) document.getElementById('btnMemberAdmin')?.classList.remove('hidden');
    } else if (canMemberAdmin) {
        document.getElementById('btnMemberAdmin')?.classList.remove('hidden');
    }

    if (canAudit !== null && canAudit) document.getElementById('btnAudit')?.classList.remove('hidden');
    if (canPerm !== null && canPerm) document.getElementById('btnPerm')?.classList.remove('hidden');
}

function showScreen(id) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('menuArea').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
    if (id === 'loginForm') {
        loginFormOpenedAt = Date.now();
        applyMagicLinkCooldown();
    }
}

let confirmModalInstance = null;
let confirmCallback = null;

function showAlert(message) {
    const body = document.getElementById('alertBody');
    if (body) body.textContent = message || '';
    if (alertModalInstance) alertModalInstance.show();
}

function showConfirm(message, onConfirm) {
    const body = document.getElementById('confirmBody');
    if (body) body.textContent = message || '';
    confirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
    if (confirmModalInstance) confirmModalInstance.show();
}

function handleConfirm() {
    if (confirmCallback) confirmCallback();
    confirmCallback = null;
    if (confirmModalInstance) confirmModalInstance.hide();
}

async function sendMagicLink() {
    const email = document.getElementById('emailInput').value;
    const btn = document.getElementById('btnSend');
    const msg = document.getElementById('statusMsg');
    const guard = evaluateMagicLinkGuard(email);
    if (!guard.ok) {
        applyMagicLinkCooldown();
        return showAlert(guard.message || "보안 정책으로 요청이 제한되었습니다.");
    }

    updateLoginGuardHint('');
    btn.disabled = true; btn.innerText = "전송 중...";
    const { error } = await _supabase.auth.signInWithOtp({ email: email, options: { emailRedirectTo: REDIRECT_URL } });
    if (error) {
        recordMagicLinkAttempt(email, false);
        showAlert("전송 실패: " + error.message);
    } else {
        recordMagicLinkAttempt(email, true);
        btn.classList.add("hidden");
        msg.style.display = "block";
        msg.textContent = "";
        const strong = document.createElement('strong');
        strong.textContent = "📩 전송 완료!";
        msg.appendChild(strong);
        msg.appendChild(document.createElement('br'));
        msg.appendChild(document.createTextNode("메일함 확인해주세요."));
    }
}

async function startKakaoLogin() {
    if (kakaoLoginInFlight) return;
    kakaoLoginInFlight = true;
    const nextTarget = `${window.location.origin}/index.html`;
    const redirectUrl = `${window.location.origin}/auth_callback.html?next=${encodeURIComponent(nextTarget)}`;
    localStorage.setItem('auth_destination', nextTarget);

    await _supabase.auth.signInWithOAuth({ 
        provider: 'kakao', 
        options: { 
            redirectTo: redirectUrl,
            scopes: 'account_email phone_number profile_nickname',
            queryParams: {
                access_type: 'offline',
                prompt: 'login'
            }
        } 
    });
    setTimeout(() => { kakaoLoginInFlight = false; }, 3000);
}

async function logout() {
    showConfirm("로그아웃 하시겠습니까?", async () => {
        await signOutSilently(_supabase);
        localStorage.removeItem('erp_user');
        localStorage.removeItem('erp_permissions');
        location.reload();
    });
}

async function loadNotifications(openModal) {
    if (!myInfo) return;
    const { data } = await _supabase
        .from('erp_notifications')
        .select('*')
        .eq('user_emp_id', myInfo.emp_id)
        .order('created_at', { ascending: false })
        .limit(20);

    lastNotifList = Array.isArray(data) ? data : [];
    renderNotificationList(lastNotifList);
    updateNotifBadge(lastNotifList);
    if (openModal && notifModalInstance) notifModalInstance.show();
}

function updateNotifBadge(list) {
    const badge = document.getElementById('notifBadge');
    if (!badge) return;
    const unread = list.filter(n => !n.is_read).length;
    if (unread > 0) {
        badge.textContent = String(unread);
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function renderNotificationList(list) {
    const container = document.getElementById('notifList');
    if (!container) return;
    container.innerHTML = '';
    if (!list || list.length === 0) {
        container.innerHTML = '<div class="p-4 text-center text-muted">알림이 없습니다.</div>';
        return;
    }
    list.forEach(item => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = `list-group-item list-group-item-action ${item.is_read ? '' : 'fw-bold'}`;
        const title = item.title || '알림';
        const msg = item.message || '';
        const time = item.created_at ? item.created_at.slice(0, 16).replace('T', ' ') : '';
        el.textContent = `${title} - ${msg} (${time})`;
        el.onclick = async () => {
            await markNotificationRead(item.id);
            if (item.link_url) location.href = item.link_url;
        };
        container.appendChild(el);
    });
}

async function openNotificationModal() {
    await loadNotifications(true);
}

async function markNotificationRead(id) {
    if (!id) return;
    await _supabase.from('erp_notifications').update({ is_read: true, read_at: new Date() }).eq('id', id);
    const updated = lastNotifList.map(n => (n.id === id ? { ...n, is_read: true } : n));
    lastNotifList = updated;
    renderNotificationList(lastNotifList);
    updateNotifBadge(lastNotifList);
}

async function markAllNotificationsRead() {
    if (!myInfo) return;
    await _supabase.from('erp_notifications')
        .update({ is_read: true, read_at: new Date() })
        .eq('user_emp_id', myInfo.emp_id)
        .eq('is_read', false);
    await loadNotifications(false);
}

document.addEventListener('DOMContentLoaded', initCommonModals);
</script>
