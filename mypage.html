async function loadPermissions(user) {
    const result = new Set();
    if (!user) return result;
    const coopId = String(user.coop_id || '').trim();
    const roleKey = user.role || '';
    const posKey = user.position || '';
    if ((!roleKey && !posKey) || !coopId) return result;

    const roleKeys = [roleKey, posKey].filter(Boolean);
    if (roleKey === 'admin_all') roleKeys.push('admin');
    if (roleKey === 'admin') roleKeys.push('admin_all');
    const { data } = await _supabase
        .from('erp_role_permissions')
        .select('permission_key')
        .eq('coop_id', coopId)
        .in('scope', ['role', 'position'])
        .in('role_key', roleKeys)
        .eq('is_enabled', true);
    if (Array.isArray(data)) {
        data.forEach(row => {
            if (row.permission_key) result.add(row.permission_key);
        });
    }
    return result;
}

function parseMypageDotDateToIso(value){
const raw=String(value||'').trim();
const m=raw.match(/(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})/);
if(!m) return '';
return `${m[1]}-${m[2]}-${m[3]}`;
}
function addDaysToIsoDate(isoDate,days){
const raw=String(isoDate||'').trim();
const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
if(!m) return '';
const d=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])));
if(Number.isNaN(d.getTime())) return '';
d.setUTCDate(d.getUTCDate()+Number(days||0));
const y=d.getUTCFullYear();
const mm=String(d.getUTCMonth()+1).padStart(2,'0');
const dd=String(d.getUTCDate()).padStart(2,'0');
return `${y}-${mm}-${dd}`;
}
function buildLeaveCalendarTitle(doc,deptText,periodText){

const ampmMatch=String(periodText||'').match(/\b(오전|오후)\b/);
const ampm=ampmMatch?ampmMatch[1]:'';
if(isMypageHalfDayLeaveSubtype(subType,doc)){
const suffix=ampm?`${ampm}${displayLabel}`:displayLabel;
return `${doc?.drafter_name||''}${deptText} ${suffix}`.trim();
}
if(displayLabel && displayLabel !== '연차'){

}

function buildLeaveCalendarEvent(doc){

// [최종 수정] 재직증명서 발급 (DB 함수 사용으로 중복 방지)
async function runCertIssue() {
    // 1. 용도 확인
    const s = document.getElementById("certPurposeSelect").value;
    const e = document.getElementById("certPurposeEtc").value;
    const purpose = (s === '기타') ? e : s;
    if (!purpose) { showAlert("용도를 입력해주세요."); return; }
    purposeModal.hide();

    // 2. 생년월일 조회
    const { data: birthDate } = await _supabase.rpc('get_emp_birthdate', { p_emp_id: myInfo.emp_id });
    const birthStr = birthDate || "미등록";

    // 3. 재직 기간 텍스트 생성
    const today = new Date();
    const dateStr = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
    let tenureStr = "-";
    if (myInfo.hire_date) {
        const join = new Date(myInfo.hire_date);
        const diff = today - join;
        const y = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
        const m = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
        tenureStr = `${myInfo.hire_date} ~ 현재 (${y}년 ${m}개월)`;
    }

    // [핵심 변경] 클라이언트 계산 로직 삭제 -> DB RPC 함수 호출
    // DB가 알아서 번호 따고, 저장까지 하고, 결과를 리턴해줍니다.
    const { data: newCert, error } = await _supabase.rpc('issue_certificate', {
        p_emp_id: myInfo.emp_id,
        p_emp_name: myInfo.emp_name,
        p_purpose: purpose,
        p_type: '재직증명서'
    });

    if (error) {
        console.error(error);
        return showAlert("발급 중 오류 발생: " + error.message);
    }

    // 4. 인쇄 데이터 준비 (DB에서 받은 cert_num 사용)
    const certData = {
        docNum: newCert.cert_num, // DB가 생성한 안전한 번호
        logo: companyInfo.logo_horizontal_url || "",
        name: myInfo.emp_name,
        birth: birthStr,
        dept: myInfo.department || "-",
        pos: myInfo.position || "-",
        address: myInfo.address || "-",
        tenure: tenureStr,
        purpose: purpose,
        today: dateStr,
        chairman: companyInfo.chairman || "이사장",
        compName: companyInfo.company_name || "용인모두의햇빛협동조합",
        compAddr: (companyInfo.company_address || "").replace(/용인모두의\s?햇빛협동조합/g, '').trim(),
        contact: companyInfo.company_contact || "",
        seal: companyInfo.seal_url
    };

    // 모듈 호출
    PrintService.printCert(certData);
}
  // [공통] 입력 시 자동 하이픈 추가 (2025-24-0002 형식)
function autoHyphenMemberId(target) {
    let val = target.value.replace(/[^0-9]/g, ''); // 숫자만 추출
    
    // 길이 제한 (최대 10자리 숫자)
    if (val.length > 10) val = val.substring(0, 10);

    // 포맷팅
    if (val.length > 6) {
        val = val.replace(/(\d{4})(\d{2})(\d{1,4})/, '$1-$2-$3');
    } else if (val.length > 4) {
        val = val.replace(/(\d{4})(\d{1,2})/, '$1-$2');
    }
    
    target.value = val;
}
